[project]
name = "text-to-sql"
version = "0.1.0"
description = "An intelligent Text-to-SQL agent with LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "grandalf>=0.8",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
cli = "text_to_sql.cli:main"
web = "text_to_sql.web:run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]




